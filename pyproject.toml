[project]
name = "discord-roulette"
version = "1.0.0"
description = "Opt-in voice-channel roulette bot for Discord"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
discord-roulette = "roulette_bot.bot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["roulette_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:discord.*"]
